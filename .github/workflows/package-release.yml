name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate and package (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and source revision
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            release_tag="$GITHUB_REF_NAME"
            publish=true
          else
            release_tag="$MANUAL_TAG"
            publish=false
          fi
          version="$(python3 scripts/release_version.py "$release_tag")"
          source_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_commit"
          if [[ "$publish" == "true" ]]; then
            test "$(git rev-parse "refs/tags/${release_tag}^{commit}")" = "$source_commit"
          fi
          source_date_epoch="$(git show -s --format=%ct "$source_commit")"
          {
            echo "version=$version"
            echo "tag=$release_tag"
            echo "publish=$publish"
            echo "source_commit=$source_commit"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Validate source and package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          pycache_root="$(mktemp -d)"
          PYTHONPYCACHEPREFIX="$pycache_root" python3 -m compileall -q \
            core ofgs_generate.py scripts tests
          bash -n install.sh uninstall.sh wrapper/ofgs
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  debian:
    needs: validate
    runs-on: ubuntu-latest
    container: debian:12
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
    steps:
      - name: Install Debian build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential debhelper devscripts git lintian python3

      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_commit }}

      - name: Trust the checked-out workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create clean release tree and build Debian package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          work_root="$RUNNER_TEMP/debian-release"
          mkdir -p "$work_root"
          git archive --format=tar --prefix="ofgs-$VERSION/" "$SOURCE_COMMIT" \
            | tar -xf - -C "$work_root"
          build_tree="$work_root/ofgs-$VERSION"
          python3 scripts/release_version.py "$RELEASE_TAG" \
            --prepare-tree "$build_tree" --format debian
          test "$(dpkg-parsechangelog -l"$build_tree/debian/changelog" -S Version)" \
            = "$VERSION-1"
          (cd "$build_tree" && dpkg-buildpackage --no-sign -b)
          deb="$work_root/ofgs_${VERSION}-1_all.deb"
          test -f "$deb"
          mkdir -p artifacts
          cp "$deb" artifacts/

      - name: Inspect and lint Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="artifacts/ofgs_${VERSION}-1_all.deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION-1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "all"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          lintian --fail-on error \
            --suppress-tags initial-upload-closes-no-bugs "$deb"

      - name: Install, exercise, and remove Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$GITHUB_WORKSPACE/artifacts/ofgs_${VERSION}-1_all.deb"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y "$deb"
          test "$(command -v ofgs)" = /usr/bin/ofgs
          grep -Fq /usr/share/ofgs /usr/bin/ofgs
          ofgs --help
          invalid_case="$(mktemp -d)"
          set +e
          (cd "$invalid_case" && ofgs generate)
          generation_status=$?
          set -e
          test "$generation_status" -eq 1
          test -z "$(find /usr/share/ofgs -type d -name __pycache__ -print -quit)"
          test -z "$(find /usr/share/ofgs -type f -name '*.pyc' -print -quit)"
          DEBIAN_FRONTEND=noninteractive apt-get remove -y ofgs
          test ! -e /usr/bin/ofgs
          test ! -e /usr/share/ofgs

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: artifacts/ofgs_${{ env.VERSION }}-1_all.deb
          if-no-files-found: error

  apt_repository:
    needs: [validate, debian]
    runs-on: ubuntu-latest
    container: debian:12
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install APT repository tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            apt-utils dpkg-dev gnupg

      - name: Download tested Debian package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: debian-package

      - name: Generate unsigned APT repository metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(debian-package/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(basename "$deb")" = "ofgs_${VERSION}-1_all.deb"
          test "$(dpkg-deb -f "$deb" Package)" = ofgs
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION-1"
          test "$(dpkg-deb -f "$deb" Architecture)" = all

          repository="$GITHUB_WORKSPACE/apt"
          packages_dir="$repository/dists/stable/main/binary-all"
          pool_dir="$repository/pool/main/o/ofgs"
          mkdir -p "$packages_dir" "$pool_dir"
          cp "$deb" "$pool_dir/"

          (
            cd "$repository"
            dpkg-scanpackages --arch all pool > \
              dists/stable/main/binary-all/Packages
            gzip -n -9 -c dists/stable/main/binary-all/Packages > \
              dists/stable/main/binary-all/Packages.gz
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=OFGS \
              -o APT::FTPArchive::Release::Label=OFGS \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures=all \
              -o APT::FTPArchive::Release::Components=main \
              -o "APT::FTPArchive::Release::Description=OFGS APT repository" \
              release dists/stable > dists/stable/Release
          )

      - name: Verify signing key and sign repository metadata
        shell: bash
        env:
          OFGS_PRIVATE_KEY: ${{ secrets.OFGS_REPOSITORY_GPG_PRIVATE_KEY }}
          OFGS_PASSPHRASE: ${{ secrets.OFGS_REPOSITORY_GPG_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ vars.OFGS_REPOSITORY_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/ofgs-gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf -- "$GNUPGHOME"' EXIT

          printf '%s' "$OFGS_PRIVATE_KEY" | gpg --batch --quiet --import
          unset OFGS_PRIVATE_KEY

          expected_fingerprint="$(
            printf '%s' "$EXPECTED_FINGERPRINT" \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{40}$ ]]

          mapfile -t imported_fingerprints < <(
            gpg --batch --with-colons --list-secret-keys --fingerprint \
              | awk -F: '
                  $1 == "sec" { primary = 1; next }
                  primary && $1 == "fpr" {
                    print toupper($10)
                    primary = 0
                  }
                '
          )
          test "${#imported_fingerprints[@]}" -eq 1
          actual_fingerprint="${imported_fingerprints[0]}"
          test "$actual_fingerprint" = "$expected_fingerprint"

          release="$GITHUB_WORKSPACE/apt/dists/stable/Release"
          printf '%s' "$OFGS_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$actual_fingerprint" \
              --digest-algo SHA256 --clearsign \
              --output "$GITHUB_WORKSPACE/apt/dists/stable/InRelease" "$release"
          printf '%s' "$OFGS_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$actual_fingerprint" \
              --digest-algo SHA256 --armor --detach-sign \
              --output "$GITHUB_WORKSPACE/apt/dists/stable/Release.gpg" "$release"
          unset OFGS_PASSPHRASE

          mkdir -p "$GITHUB_WORKSPACE/public-key"
          gpg --batch --export "$actual_fingerprint" > \
            "$GITHUB_WORKSPACE/public-key/ofgs-repository.gpg"
          chmod 0644 "$GITHUB_WORKSPACE/public-key/ofgs-repository.gpg"

      - name: Validate signed repository files
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/apt"
          public_key="$GITHUB_WORKSPACE/public-key/ofgs-repository.gpg"
          test -s "$repository/dists/stable/main/binary-all/Packages"
          test -s "$repository/dists/stable/main/binary-all/Packages.gz"
          test -s "$repository/dists/stable/Release"
          test -s "$repository/dists/stable/InRelease"
          test -s "$repository/dists/stable/Release.gpg"
          test -s "$repository/pool/main/o/ofgs/ofgs_${VERSION}-1_all.deb"
          test -s "$public_key"
          grep -Fq "Filename: pool/main/o/ofgs/ofgs_${VERSION}-1_all.deb" \
            "$repository/dists/stable/main/binary-all/Packages"
          grep -Fq "main/binary-all/Packages" \
            "$repository/dists/stable/Release"
          grep -Fq "main/binary-all/Packages.gz" \
            "$repository/dists/stable/Release"
          gpgv --keyring "$public_key" "$repository/dists/stable/InRelease"
          gpgv --keyring "$public_key" \
            "$repository/dists/stable/Release.gpg" \
            "$repository/dists/stable/Release"

      - name: Upload signed APT repository
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository
          path: apt
          if-no-files-found: error

      - name: Upload APT repository public key for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository-public-key
          path: public-key/ofgs-repository.gpg
          if-no-files-found: error

  apt_acceptance:
    needs: [validate, apt_repository]
    runs-on: ubuntu-latest
    container: debian:12
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download signed APT repository
        uses: actions/download-artifact@v4
        with:
          name: apt-repository
          path: apt

      - name: Download OFGS repository public key
        uses: actions/download-artifact@v4
        with:
          name: apt-repository-public-key
          path: public-key

      - name: Configure signed repository and update APT
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rX apt
          install -D -m 0644 public-key/ofgs-repository.gpg \
            /usr/share/keyrings/ofgs-repository.gpg
          printf '%s\n' \
            "deb [arch=all signed-by=/usr/share/keyrings/ofgs-repository.gpg] file:${GITHUB_WORKSPACE}/apt stable main" \
            > /etc/apt/sources.list.d/ofgs.list
          apt-get update
          policy="$(apt-cache policy ofgs)"
          test "$(awk '/Candidate:/ { print $2 }' <<< "$policy")" = "$VERSION-1"
          grep -Fq "file:${GITHUB_WORKSPACE}/apt" <<< "$policy"

      - name: Install OFGS through APT, exercise it, and remove it
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y ofgs
          test "$(dpkg-query -W -f='${Version}' ofgs)" = "$VERSION-1"
          test "$(command -v ofgs)" = /usr/bin/ofgs
          test -d /usr/share/ofgs
          grep -Fq /usr/share/ofgs /usr/bin/ofgs
          ofgs --help
          invalid_case="$(mktemp -d)"
          set +e
          (cd "$invalid_case" && ofgs generate)
          generation_status=$?
          set -e
          test "$generation_status" -eq 1
          test -z "$(find /usr/share/ofgs -type d -name __pycache__ -print -quit)"
          test -z "$(find /usr/share/ofgs -type f -name '*.pyc' -print -quit)"
          DEBIAN_FRONTEND=noninteractive apt-get remove -y ofgs
          test ! -e /usr/bin/ofgs
          test ! -e /usr/share/ofgs

  rpm:
    needs: validate
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - name: Install EL9 build tools
        run: |
          dnf install -y \
            bash findutils git gzip make python3 redhat-rpm-config \
            rpm-build rpmdevtools rpmlint tar which

      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_commit }}

      - name: Trust the checked-out workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create deterministic source archive and build RPM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          work_root="$RUNNER_TEMP/rpm-release"
          source_root="$work_root/source"
          topdir="$work_root/rpmbuild"
          mkdir -p "$source_root" "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar --prefix="OFGS-$VERSION/" "$SOURCE_COMMIT" \
            | tar -xf - -C "$source_root"
          release_tree="$source_root/OFGS-$VERSION"
          python3 scripts/release_version.py "$RELEASE_TAG" \
            --prepare-tree "$release_tree" --format rpm
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            -C "$source_root" -cf - "OFGS-$VERSION" \
            | gzip -n > "$topdir/SOURCES/ofgs-$VERSION.tar.gz"
          cp packaging/rpm/ofgs.spec "$topdir/SPECS/ofgs.spec"
          rpm_version="$(rpmspec -q --qf '%{VERSION}\n' \
            --define "upstream_version $VERSION" "$topdir/SPECS/ofgs.spec")"
          test "$rpm_version" = "$VERSION"
          rpmbuild -bb \
            --define "_topdir $topdir" \
            --define "upstream_version $VERSION" \
            "$topdir/SPECS/ofgs.spec"
          rpm="$topdir/RPMS/noarch/ofgs-${VERSION}-1.el9.noarch.rpm"
          test -f "$rpm"
          mkdir -p artifacts
          cp "$rpm" artifacts/

      - name: Inspect and lint RPM
        shell: bash
        run: |
          set -euo pipefail
          rpm="artifacts/ofgs-${VERSION}-1.el9.noarch.rpm"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$rpm")" \
            = "$VERSION-1.el9"
          test "$(rpm -qp --qf '%{ARCH}\n' "$rpm")" = "noarch"
          rpm -qip "$rpm"
          rpm -qlp "$rpm"
          rpm -qpR "$rpm"
          rpmlint "$rpm"

      - name: Enable EPEL, install, exercise, and remove RPM
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y epel-release
          rpm="$GITHUB_WORKSPACE/artifacts/ofgs-${VERSION}-1.el9.noarch.rpm"
          dnf install -y "$rpm"
          test "$(command -v ofgs)" = /usr/bin/ofgs
          grep -Fq /usr/share/ofgs /usr/bin/ofgs
          ofgs --help
          invalid_case="$(mktemp -d)"
          set +e
          (cd "$invalid_case" && ofgs generate)
          generation_status=$?
          set -e
          test "$generation_status" -eq 1
          test -z "$(find /usr/share/ofgs -type d -name __pycache__ -print -quit)"
          test -z "$(find /usr/share/ofgs -type f -name '*.pyc' -print -quit)"
          dnf remove -y ofgs
          test ! -e /usr/bin/ofgs
          test ! -e /usr/share/ofgs

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: artifacts/ofgs-${{ env.VERSION }}-1.el9.noarch.rpm
          if-no-files-found: error

  rpm_repository:
    needs: [validate, rpm]
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install RPM repository tools
        run: |
          dnf install -y createrepo_c findutils gnupg2 rpm-sign

      - name: Download tested RPM package
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpm-package

      - name: Prepare RPM repository package tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(rpm-package/*.rpm)
          test "${#rpms[@]}" -eq 1
          source_rpm="${rpms[0]}"
          test "$(basename "$source_rpm")" = \
            "ofgs-${VERSION}-1.el9.noarch.rpm"
          test "$(rpm -qp --qf '%{NAME}\n' "$source_rpm")" = ofgs
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$source_rpm")" = \
            "$VERSION-1.el9"
          test "$(rpm -qp --qf '%{ARCH}\n' "$source_rpm")" = noarch

          mkdir -p rpm/Packages
          cp "$source_rpm" rpm/Packages/

      - name: Verify signing key and sign RPM repository
        shell: bash
        env:
          OFGS_PRIVATE_KEY: ${{ secrets.OFGS_REPOSITORY_GPG_PRIVATE_KEY }}
          OFGS_PASSPHRASE: ${{ secrets.OFGS_REPOSITORY_GPG_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ vars.OFGS_REPOSITORY_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/ofgs-rpm-gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' allow-preset-passphrase > "$GNUPGHOME/gpg-agent.conf"
          chmod 0600 "$GNUPGHOME/gpg-agent.conf"
          cleanup_signing_home() {
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent \
              >/dev/null 2>&1 || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup_signing_home EXIT

          printf '%s' "$OFGS_PRIVATE_KEY" | gpg2 --batch --quiet --import
          unset OFGS_PRIVATE_KEY

          expected_fingerprint="$(
            printf '%s' "$EXPECTED_FINGERPRINT" \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{40}$ ]]

          mapfile -t imported_fingerprints < <(
            gpg2 --batch --with-colons --list-secret-keys --fingerprint \
              | awk -F: '
                  $1 == "sec" { primary = 1; next }
                  primary && $1 == "fpr" {
                    print toupper($10)
                    primary = 0
                  }
                '
          )
          test "${#imported_fingerprints[@]}" -eq 1
          actual_fingerprint="${imported_fingerprints[0]}"
          test "$actual_fingerprint" = "$expected_fingerprint"

          mapfile -t secret_keygrips < <(
            gpg2 --batch --with-colons --with-keygrip \
              --list-secret-keys "$actual_fingerprint" \
              | awk -F: '$1 == "grp" { print toupper($10) }'
          )
          test "${#secret_keygrips[@]}" -ge 1
          preset_passphrase=/usr/libexec/gpg-preset-passphrase
          test -x "$preset_passphrase"
          for keygrip in "${secret_keygrips[@]}"; do
            [[ "$keygrip" =~ ^[0-9A-F]{40}$ ]]
            printf '%s' "$OFGS_PASSPHRASE" | \
              "$preset_passphrase" --preset "$keygrip"
          done

          package="$GITHUB_WORKSPACE/rpm/Packages/ofgs-${VERSION}-1.el9.noarch.rpm"
          sign_command="$(rpm \
            --define "_gpg_sign_cmd_extra_args --batch --no-tty" \
            --eval '%{__gpg_sign_cmd}')"
          grep -Fq -- '--batch' <<< "$sign_command"
          grep -Fq -- '--no-tty' <<< "$sign_command"
          rpmsign --addsign \
            --define "_signature gpg" \
            --define "_gpg_name $actual_fingerprint" \
            --define "_gpg_path $GNUPGHOME" \
            --define "_gpg_digest_algo sha256" \
            --define "_gpg_sign_cmd_extra_args --batch --no-tty" \
            "$package"

          createrepo_c "$GITHUB_WORKSPACE/rpm"
          repomd="$GITHUB_WORKSPACE/rpm/repodata/repomd.xml"
          printf '%s' "$OFGS_PASSPHRASE" | \
            gpg2 --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$actual_fingerprint" \
              --digest-algo SHA256 --armor --detach-sign \
              --output "${repomd}.asc" "$repomd"
          unset OFGS_PASSPHRASE

          mkdir -p "$GITHUB_WORKSPACE/rpm-public-key"
          gpg2 --batch --export "$actual_fingerprint" > \
            "$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.gpg"
          gpg2 --batch --armor --export "$actual_fingerprint" > \
            "$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.asc"
          chmod 0644 "$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.gpg"
          chmod 0644 "$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.asc"

      - name: Validate signed RPM repository
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/rpm"
          package="$repository/Packages/ofgs-${VERSION}-1.el9.noarch.rpm"
          repomd="$repository/repodata/repomd.xml"
          gpgv_key="$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.gpg"
          rpm_key="$GITHUB_WORKSPACE/rpm-public-key/ofgs-repository.asc"

          test -s "$package"
          test "$(rpm -qp --qf '%{NAME}\n' "$package")" = ofgs
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$package")" = \
            "$VERSION-1.el9"
          test "$(rpm -qp --qf '%{ARCH}\n' "$package")" = noarch
          test -s "$repomd"
          test -s "${repomd}.asc"
          test -s "$gpgv_key"
          test -s "$rpm_key"
          ! grep -a -Fq -- '-----BEGIN PGP PUBLIC KEY BLOCK-----' "$gpgv_key"
          test "$(head -n 1 "$rpm_key")" = \
            '-----BEGIN PGP PUBLIC KEY BLOCK-----'
          grep -Fq -- '-----END PGP PUBLIC KEY BLOCK-----' "$rpm_key"
          test -n "$(find "$repository/repodata" -type f \
            ! -name repomd.xml ! -name repomd.xml.asc -print -quit)"
          test -z "$(find "$repository" -type f -empty -print -quit)"
          test -z "$(find "$repository" ! -type d ! -type f -print -quit)"
          test -z "$(find "$repository" -iname '*gnupg*' \
            -o -iname 'private-keys-v1.d' \
            -o -iname 'pubring.*' \
            -o -iname 'trustdb.gpg')"
          if grep -R -a -q -E \
            'BEGIN (PGP )?PRIVATE KEY|OFGS_REPOSITORY_GPG_PRIVATE_KEY|OFGS_REPOSITORY_GPG_PASSPHRASE' \
            "$repository"; then
            echo "Unexpected sensitive material marker in RPM repository." >&2
            exit 1
          fi

          verification_home="$(mktemp -d "$RUNNER_TEMP/ofgs-rpm-gpgv.XXXXXX")"
          chmod 700 "$verification_home"
          gpgv2 --homedir "$verification_home" --keyring "$gpgv_key" \
            "${repomd}.asc" "$repomd"
          rpm_database="$(mktemp -d "$RUNNER_TEMP/ofgs-rpmdb.XXXXXX")"
          rpm --dbpath "$rpm_database" --initdb
          rpm --dbpath "$rpm_database" --import "$rpm_key"
          signature_check="$(
            rpmkeys --dbpath "$rpm_database" --checksig "$package"
          )"
          grep -Fq 'digests signatures OK' <<< "$signature_check"

      - name: Upload signed RPM repository
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repository
          path: rpm
          if-no-files-found: error

      - name: Upload RPM repository public key for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repository-public-key
          path: rpm-public-key
          if-no-files-found: error

  rpm_acceptance:
    needs: [validate, rpm_repository]
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Enable EPEL and install repository test tools
        run: |
          dnf install -y dnf-plugins-core epel-release

      - name: Download signed RPM repository
        uses: actions/download-artifact@v4
        with:
          name: rpm-repository
          path: rpm

      - name: Download OFGS repository public key
        uses: actions/download-artifact@v4
        with:
          name: rpm-repository-public-key
          path: rpm-public-key

      - name: Configure signed OFGS repository and verify its package
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rX rpm rpm-public-key
          printf '%s\n' \
            '[ofgs]' \
            'name=OFGS EL9' \
            "baseurl=file://${GITHUB_WORKSPACE}/rpm" \
            'enabled=1' \
            'gpgcheck=1' \
            'repo_gpgcheck=1' \
            "gpgkey=file://${GITHUB_WORKSPACE}/rpm-public-key/ofgs-repository.asc" \
            > /etc/yum.repos.d/ofgs.repo
          dnf clean all
          dnf -y --disablerepo='*' --enablerepo=ofgs makecache
          repository_package="$(
            dnf -q --disablerepo='*' --enablerepo=ofgs repoquery \
              --qf '%{name}|%{version}-%{release}|%{arch}' ofgs
          )"
          test "$repository_package" = \
            "ofgs|${VERSION}-1.el9|noarch"
          package_location="$(
            dnf -q --disablerepo='*' --enablerepo=ofgs repoquery \
              --location ofgs
          )"
          [[ "$package_location" == file:*"/rpm/Packages/ofgs-${VERSION}-1.el9.noarch.rpm" ]]

      - name: Install OFGS through DNF, exercise it, and remove it
        shell: bash
        run: |
          set -euo pipefail
          dnf -y \
            --disablerepo='*' \
            --enablerepo=baseos \
            --enablerepo=appstream \
            --enablerepo=extras \
            --enablerepo=epel \
            --enablerepo=ofgs \
            repository-packages ofgs install ofgs
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' ofgs)" = \
            "$VERSION-1.el9"
          test "$(command -v ofgs)" = /usr/bin/ofgs
          test -d /usr/share/ofgs
          grep -Fq /usr/share/ofgs /usr/bin/ofgs
          ofgs --help
          invalid_case="$(mktemp -d)"
          set +e
          (cd "$invalid_case" && ofgs generate)
          generation_status=$?
          set -e
          test "$generation_status" -eq 1
          test -z "$(find /usr/share/ofgs -type d -name __pycache__ -print -quit)"
          test -z "$(find /usr/share/ofgs -type f -name '*.pyc' -print -quit)"
          dnf remove -y ofgs
          test ! -e /usr/bin/ofgs
          test ! -e /usr/share/ofgs

  publish:
    needs: [validate, debian, rpm]
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          test -f "ofgs_${VERSION}-1_all.deb"
          test -f "ofgs-${VERSION}-1.el9.noarch.rpm"
          LC_ALL=C sha256sum \
            "ofgs_${VERSION}-1_all.deb" \
            "ofgs-${VERSION}-1.el9.noarch.rpm" \
            > "ofgs-${VERSION}-SHA256SUMS"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/ofgs_${VERSION}-1_all.deb"
            "dist/ofgs-${VERSION}-1.el9.noarch.rpm"
            "dist/ofgs-${VERSION}-SHA256SUMS"
          )
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              "${assets[@]}" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

  publish_apt:
    needs: [validate, debian, rpm, apt_repository, apt_acceptance]
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: ofgs-package-website-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out current website main
        uses: actions/checkout@v4
        with:
          repository: ahmedmunzir/munzirahmed.dev
          ref: main
          token: ${{ secrets.OFGS_WEBSITE_PUBLISH_TOKEN }}
          persist-credentials: false
          path: website

      - name: Download accepted APT repository
        uses: actions/download-artifact@v4
        with:
          name: apt-repository
          path: ${{ runner.temp }}/apt-repository

      - name: Validate tested APT repository artifact
        shell: bash
        env:
          APT_ARTIFACT: ${{ runner.temp }}/apt-repository
        run: |
          set -euo pipefail
          expected_files=(
            dists/stable/InRelease
            dists/stable/Release
            dists/stable/Release.gpg
            dists/stable/main/binary-all/Packages
            dists/stable/main/binary-all/Packages.gz
            "pool/main/o/ofgs/ofgs_${VERSION}-1_all.deb"
          )
          mapfile -t actual_files < <(
            cd "$APT_ARTIFACT"
            find . -type f -printf '%P\n' | LC_ALL=C sort
          )
          test "${#actual_files[@]}" -eq "${#expected_files[@]}"
          for index in "${!expected_files[@]}"; do
            test "${actual_files[$index]}" = "${expected_files[$index]}"
            test -s "$APT_ARTIFACT/${expected_files[$index]}"
          done
          test -z "$(
            find "$APT_ARTIFACT" ! -type d ! -type f -print -quit
          )"
          if grep -R -a -q -E \
            'BEGIN (PGP )?PRIVATE KEY|OFGS_REPOSITORY_GPG_PRIVATE_KEY|OFGS_REPOSITORY_GPG_PASSPHRASE|OFGS_WEBSITE_PUBLISH_TOKEN' \
            "$APT_ARTIFACT"; then
            echo "Unexpected sensitive material marker in APT artifact." >&2
            exit 1
          fi

      - name: Replace only website APT repository and create scoped commit
        id: update
        shell: bash
        working-directory: website
        env:
          APT_ARTIFACT: ${{ runner.temp }}/apt-repository
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f packages/keys/ofgs-repository.asc
          test -f packages/keys/ofgs-repository.gpg
          keys_before="$(sha256sum \
            packages/keys/ofgs-repository.asc \
            packages/keys/ofgs-repository.gpg)"

          git rm -r --ignore-unmatch -- packages/apt
          mkdir -p packages/apt
          cp -a "$APT_ARTIFACT"/. packages/apt/
          diff -qr "$APT_ARTIFACT" packages/apt
          keys_after="$(sha256sum \
            packages/keys/ofgs-repository.asc \
            packages/keys/ofgs-repository.gpg)"
          test "$keys_after" = "$keys_before"

          git add --all -- packages/apt
          test -z "$(git status --porcelain --untracked-files=all -- \
            . ':(exclude)packages/apt' ':(exclude)packages/apt/**')"
          git diff --quiet -- packages/keys
          git diff --cached --quiet -- packages/keys

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Website APT repository is already current."
            exit 0
          fi

          while IFS= read -r changed_path; do
            [[ "$changed_path" == packages/apt/* ]]
          done < <(git diff --cached --name-only)

          git config user.name "OFGS release automation"
          git config user.email "ofgs-release-automation@users.noreply.github.com"
          git commit -m "Publish OFGS ${VERSION} APT repository"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push website APT repository update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        working-directory: website
        env:
          OFGS_WEBSITE_TOKEN: ${{ secrets.OFGS_WEBSITE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          askpass="$(mktemp "$RUNNER_TEMP/ofgs-git-askpass.XXXXXX")"
          cleanup_credentials() {
            unset OFGS_WEBSITE_TOKEN
            rm -f -- "$askpass"
          }
          trap cleanup_credentials EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\n" "$OFGS_WEBSITE_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 0700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force \
            GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
          cleanup_credentials
          trap - EXIT

  publish_rpm:
    needs: [validate, debian, rpm, apt_repository, apt_acceptance, rpm_repository, rpm_acceptance]
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: ofgs-package-website-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install RPM artifact inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download accepted EL9 RPM repository
        uses: actions/download-artifact@v4
        with:
          name: rpm-repository
          path: ${{ runner.temp }}/rpm-repository

      - name: Validate accepted EL9 RPM repository artifact
        shell: bash
        env:
          RPM_ARTIFACT: ${{ runner.temp }}/rpm-repository
        run: |
          set -euo pipefail
          package="$RPM_ARTIFACT/Packages/ofgs-${VERSION}-1.el9.noarch.rpm"
          repomd="$RPM_ARTIFACT/repodata/repomd.xml"

          test -s "$package"
          test "$(rpm -qp --qf '%{NAME}\n' "$package")" = ofgs
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$package")" = \
            "$VERSION-1.el9"
          test "$(rpm -qp --qf '%{ARCH}\n' "$package")" = noarch
          test -s "$repomd"
          test -s "${repomd}.asc"
          mapfile -t top_level_entries < <(
            find "$RPM_ARTIFACT" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )
          test "${#top_level_entries[@]}" -eq 2
          test "${top_level_entries[0]}" = Packages
          test "${top_level_entries[1]}" = repodata
          test -n "$(find "$RPM_ARTIFACT/repodata" -type f \
            ! -name repomd.xml ! -name repomd.xml.asc -print -quit)"
          test -z "$(find "$RPM_ARTIFACT" -type f -empty -print -quit)"
          test -z "$(find "$RPM_ARTIFACT" ! -type d ! -type f -print -quit)"
          test -z "$(find "$RPM_ARTIFACT" -iname '*gnupg*' \
            -o -iname 'private-keys-v1.d' \
            -o -iname 'pubring.*' \
            -o -iname 'trustdb.gpg' \
            -o -name .git \
            -o -name .github)"
          mapfile -t packages < <(
            find "$RPM_ARTIFACT/Packages" -mindepth 1 -maxdepth 1 \
              -type f -printf '%f\n' | LC_ALL=C sort
          )
          test "${#packages[@]}" -eq 1
          test "${packages[0]}" = "ofgs-${VERSION}-1.el9.noarch.rpm"
          if grep -R -a -q -E \
            'BEGIN (PGP )?PRIVATE KEY|OFGS_REPOSITORY_GPG_PRIVATE_KEY|OFGS_REPOSITORY_GPG_PASSPHRASE|OFGS_WEBSITE_PUBLISH_TOKEN' \
            "$RPM_ARTIFACT"; then
            echo "Unexpected sensitive material marker in RPM artifact." >&2
            exit 1
          fi

      - name: Check out current website main
        uses: actions/checkout@v4
        with:
          repository: ahmedmunzir/munzirahmed.dev
          ref: main
          token: ${{ secrets.OFGS_WEBSITE_PUBLISH_TOKEN }}
          persist-credentials: false
          path: website

      - name: Replace only website EL9 RPM repository and create scoped commit
        id: update
        shell: bash
        working-directory: website
        env:
          RPM_ARTIFACT: ${{ runner.temp }}/rpm-repository
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -d packages/apt
          test -f packages/keys/ofgs-repository.asc
          test -f packages/keys/ofgs-repository.gpg
          keys_before="$(sha256sum \
            packages/keys/ofgs-repository.asc \
            packages/keys/ofgs-repository.gpg)"

          git rm -r --ignore-unmatch -- packages/rpm/el9
          mkdir -p packages/rpm/el9
          cp -a "$RPM_ARTIFACT"/. packages/rpm/el9/
          diff -qr "$RPM_ARTIFACT" packages/rpm/el9
          keys_after="$(sha256sum \
            packages/keys/ofgs-repository.asc \
            packages/keys/ofgs-repository.gpg)"
          test "$keys_after" = "$keys_before"

          git add --all -- packages/rpm/el9
          test -z "$(git status --porcelain --untracked-files=all -- \
            . ':(exclude)packages/rpm/el9' \
            ':(exclude)packages/rpm/el9/**')"
          git diff --quiet -- packages/apt packages/keys
          git diff --cached --quiet -- packages/apt packages/keys

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Website EL9 RPM repository is already current."
            exit 0
          fi

          while IFS= read -r changed_path; do
            [[ "$changed_path" == packages/rpm/el9/* ]]
          done < <(git diff --cached --name-only)

          git config user.name "OFGS release automation"
          git config user.email "ofgs-release-automation@users.noreply.github.com"
          git commit -m "Publish OFGS ${VERSION} EL9 RPM repository"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push website EL9 RPM repository update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        working-directory: website
        env:
          OFGS_WEBSITE_TOKEN: ${{ secrets.OFGS_WEBSITE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          askpass="$(mktemp "$RUNNER_TEMP/ofgs-git-askpass.XXXXXX")"
          cleanup_credentials() {
            unset OFGS_WEBSITE_TOKEN
            rm -f -- "$askpass"
          }
          trap cleanup_credentials EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\n" "$OFGS_WEBSITE_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 0700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_ASKPASS_REQUIRE=force \
            GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
          cleanup_credentials
          trap - EXIT
