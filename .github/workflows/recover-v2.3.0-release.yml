name: Recover v2.3.0 GitHub Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-v2.3.0-github-release
  cancel-in-progress: false

jobs:
  recover_release:
    if: github.repository == 'ahmedmunzir/OFGS'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.3.0
      VERSION: 2.3.0
      SOURCE_RUN_ID: 31475548580
      EXPECTED_COMMIT: 9adcdc3b88983d19496690e0819157f86c169461
    steps:
      - name: Verify immutable annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ahmedmunzir/OFGS

          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          test "$object_type" = tag

          for depth in 1 2 3 4 5; do
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [[ "$object_type" == commit ]]; then
              break
            fi
            test "$object_type" = tag
          done

          test "$object_type" = commit
          test "$object_sha" = "$EXPECTED_COMMIT"

          read -r run_event run_conclusion run_commit < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
              --jq '[.event, .conclusion, .head_sha] | @tsv'
          )
          test "$run_event" = push
          test "$run_conclusion" = failure
          test "$run_commit" = "$EXPECTED_COMMIT"

      - name: Download v2.3.0 Debian package from validated run
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: recovered
          repository: ahmedmunzir/OFGS
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download v2.3.0 EL9 RPM from validated run
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: recovered
          repository: ahmedmunzir/OFGS
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install RPM metadata inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Validate recovered packages and create checksums
        shell: bash
        working-directory: recovered
        run: |
          set -euo pipefail
          deb="ofgs_${VERSION}-1_all.deb"
          rpm_package="ofgs-${VERSION}-1.el9.noarch.rpm"
          checksum="ofgs-${VERSION}-SHA256SUMS"

          mapfile -t recovered_entries < <(
            find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort
          )
          test "${#recovered_entries[@]}" -eq 2
          test "${recovered_entries[0]}" = "$rpm_package"
          test "${recovered_entries[1]}" = "$deb"
          test -z "$(find . -mindepth 2 -print -quit)"
          test -z "$(find . ! -type d ! -type f -print -quit)"
          test -s "$deb"
          test -s "$rpm_package"

          test "$(dpkg-deb -f "$deb" Package)" = ofgs
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION-1"
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          test "$(rpm -qp --qf '%{NAME}\n' "$rpm_package")" = ofgs
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$rpm_package")" = \
            "$VERSION-1.el9"
          test "$(rpm -qp --qf '%{ARCH}\n' "$rpm_package")" = noarch

          LC_ALL=C sha256sum "$deb" "$rpm_package" > "$checksum"
          test "$(wc -l < "$checksum")" -eq 2
          sha256sum --check "$checksum"

      - name: Create or update v2.3.0 GitHub Release
        shell: bash
        working-directory: recovered
        run: |
          set -euo pipefail
          assets=(
            "ofgs_${VERSION}-1_all.deb"
            "ofgs-${VERSION}-1.el9.noarch.rpm"
            "ofgs-${VERSION}-SHA256SUMS"
          )
          test "${#assets[@]}" -eq 3
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              "${assets[@]}" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
